name: Godot Web export and Pages deploy

# PR: 웹 내보내기만 해서 깨진 곳이 없는지 확인한다.
# main에 push: 내보낸 뒤 GitHub Pages로 배포한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5

      - name: Move export templates to HOME
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import and export Web
        run: |
          mkdir -v -p build/web
          touch build/.gdignore
          godot --headless --import

      # 게임을 30초(게임 시간) 동안 혼자 돌려서 스크립트 오류가 있으면 실패시킨다.
      - name: Smoke run (autoplay)
        run: |
          godot --headless --fixed-fps 60 --quit-after 1800 -- --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE: autoplay on" smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then exit 1; fi

      - name: Export Web
        run: |
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
